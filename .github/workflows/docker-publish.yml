name: Product Service CI/CD

on:
  push:
    branches: [ "main" ] # 只有推送到 main 分支时才触发

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        # -pl 指定构建 product-service，-am 确保依赖的其他模块（如 common）也被构建
        run: mvn clean package -DskipTests -pl product-service -am

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.jaydanan }}
          password: ${{ secrets.dckr_pat_gxDCHV4LNIqpvhBOkKLR4AteU94 }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          # 重要：context 必须指向包含 Dockerfile 的文件夹
          context: ./product-service
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/product-service:latest