spring:
  application:
    name: product-service
  cloud:
    config:
      enabled: false
  # 注意：datasource 前面必须只有 2 个空格！
  datasource:
    url: jdbc:postgresql://localhost:5432/product_db
    username: postgres
    password: password123
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
      # 1. 告诉服务去哪里找配置中心
      # uri: http://config-server:8888
